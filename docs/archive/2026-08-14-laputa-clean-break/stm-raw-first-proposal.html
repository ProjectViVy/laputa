<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garden MemoryOS — Raw-first STM</title><style>
body{margin:0;background:#020617;color:#e2e8f0;font-family:ui-monospace,"Cascadia Mono",monospace}.wrap{max-width:1380px;margin:auto;padding:28px}.head{border-bottom:1px solid #1e293b;margin-bottom:16px;padding-bottom:15px}h1{font-size:22px;margin:0;color:#f8fafc}.sub{margin-top:8px;color:#94a3b8;font-size:13px}svg{width:100%;height:auto;background:#0f172a;border:1px solid #1e293b;border-radius:12px}.box{stroke-width:2;rx:10}.t{font-size:16px;font-weight:700;fill:#f8fafc}.s{font-size:12px;fill:#cbd5e1}.m{font-size:11px;fill:#94a3b8}.label{font-size:11px;fill:#fbbf24}.card{margin-top:16px;border:1px solid #334155;border-radius:10px;padding:14px;background:#0f172a}.card b{color:#34d399}.warn{color:#fbbf24}</style></head><body><main class="wrap"><header class="head"><h1>Garden MemoryOS · Raw-first STM</h1><div class="sub">原文先安全落地；STM 可由 Agent 修改；压缩是可失败的派生优化，不是持久化前提。</div></header>
<svg viewBox="0 0 1320 700" role="img" aria-label="STM raw-first architecture diagram"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern></defs><rect width="1320" height="700" fill="url(#g)"/>
<!-- arrows behind --> <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M250 150H320"/><path d="M570 150H650"/><path d="M870 150H940"/><path d="M445 225V370"/><path d="M760 225V370"/><path d="M1070 225V370"/><path d="M570 450H650"/><path d="M870 450H940"/><path d="M445 510V595H1035V510"/><path d="M1110 450H1190V150H1160" stroke="#fb7185" stroke-dasharray="7 5"/><path d="M1110 450H1190V595H1035" stroke="#34d399" stroke-dasharray="7 5"/></g>
<!-- top --> <rect class="box" x="55" y="105" width="195" height="120" fill="#083344" stroke="#22d3ee"/><text class="t" x="78" y="140">Host / Agent</text><text class="s" x="78" y="168">chat · tool · hook</text><text class="s" x="78" y="188">source ingest event</text><text class="m" x="78" y="210">event_id + hash + scope</text>
<rect class="box" x="320" y="105" width="250" height="120" fill="#064e3b" stroke="#34d399"/><text class="t" x="345" y="140">Activity Gateway</text><text class="s" x="345" y="168">canonicalize · idempotency</text><text class="s" x="345" y="188">route by health state</text><text class="m" x="345" y="210">write acknowledgement boundary</text>
<rect class="box" x="650" y="105" width="220" height="120" fill="#4c1d95" stroke="#a78bfa"/><text class="t" x="675" y="140">Mentle</text><text class="s" x="675" y="168">verbatim material lake</text><text class="s" x="675" y="188">cards · evidence · search</text><text class="m" x="675" y="210">normal durable raw path</text>
<rect class="box" x="940" y="105" width="220" height="120" fill="#4c1d95" stroke="#a78bfa"/><text class="t" x="965" y="140">Raw SourceArtifact</text><text class="s" x="965" y="168">original content + provenance</text><text class="s" x="965" y="188">revision · hash · material ref</text><text class="m" x="965" y="210">not automatically LTM</text>
<!-- middle --> <rect class="box" x="320" y="370" width="250" height="140" fill="#083344" stroke="#22d3ee"/><text class="t" x="345" y="405">STM Runtime Cache</text><text class="s" x="345" y="433">hot_context[session]</text><text class="s" x="345" y="453">recent_activity[session]</text><text class="s" x="345" y="473">working_set[scope]</text><text class="m" x="345" y="495">Agent may modify; TTL; rebuildable</text>
<rect class="box" x="650" y="370" width="220" height="140" fill="#4c1d95" stroke="#a78bfa"/><text class="t" x="675" y="405">Laputa</text><text class="s" x="675" y="433">MEMORY.MD checkpoint</text><text class="s" x="675" y="453">transient spool fallback</text><text class="s" x="675" y="473">native bounded read API</text><text class="m" x="675" y="495">minimal revision log, not heavy audit</text>
<rect class="box" x="940" y="370" width="220" height="140" fill="#78350f" stroke="#fbbf24"/><text class="t" x="965" y="405">Optional Derivation</text><text class="s" x="965" y="433">LLM compression</text><text class="s" x="965" y="453">STM segment / suggestion</text><text class="s" x="965" y="473">checkpoint draft</text><text class="m" x="965" y="495">failure never loses raw material</text>

<text class="label" x="1130" y="287">LLM unavailable:</text><text class="label" x="1130" y="304">skip derivation</text><text class="label" x="1130" y="321">raw chain continues</text><text class="label" x="1130" y="575">Mentle recovery:</text><text class="label" x="1130" y="592">drain by event_id + hash</text>
</svg><section class="card"><b>写入承诺</b>：请求成功意味着原文已落在 Mentle，或已落在 Laputa transient spool；不意味着摘要已生成。<br><b>编辑承诺</b>：Agent 可编辑 STM 的 working set 与 checkpoint；原文不原地覆盖，修订生成新的 projection/revision，并保留 source ref。<br><span class="warn">LTM promotion 仍不是普通 STM 编辑：它走明确确认/提案路径。</span></section></main></body></html>
