<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garden Laputa Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'JetBrains Mono', monospace;
      background: #020617;
      min-height: 100vh;
      padding: 2rem;
      color: white;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { margin-bottom: 1.5rem; }
    .header-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem; }
    .pulse-dot { width: 12px; height: 12px; background: #22d3ee; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    h1 { font-size: 1.5rem; font-weight: 700; }
    .subtitle { color: #94a3b8; font-size: 0.875rem; margin-left: 1.75rem; }
    .diagram-container {
      background: rgba(15, 23, 42, 0.5);
      border-radius: 1rem; border: 1px solid #1e293b;
      padding: 1.5rem; overflow-x: auto;
    }
    svg { width: 100%; min-width: 900px; display: block; }
    .footer { text-align: center; margin-top: 1.5rem; color: #475569; font-size: 0.75rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-row">
        <div class="pulse-dot"></div>
        <h1>Garden Laputa Architecture</h1>
      </div>
      <p class="subtitle">Single garden.exe &middot; HTTP :7373 &middot; Phase 0–5 complete (2026-07-14)</p>
    </div>

    <div class="diagram-container">
      <svg viewBox="0 0 1100 740">
        <defs>
          <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
          </marker>
          <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
          </marker>
          <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
          </marker>
          <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)"/>

        <!-- ============================================================
             ROW 1: Caller
             ============================================================ -->
        <rect x="450" y="30" width="200" height="46" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="550" y="50" fill="white" font-size="13" font-weight="600" text-anchor="middle">User / Agent</text>
        <text x="550" y="66" fill="#94a3b8" font-size="9" text-anchor="middle">Hermes &middot; curl &middot; MCP client</text>

        <line x1="550" y1="76" x2="550" y2="120" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
        <text x="566" y="103" fill="#94a3b8" font-size="10">HTTPS</text>

        <!-- ============================================================
             ROW 2: garden.exe + 7 endpoint groups
             ============================================================ -->
        <rect x="100" y="120" width="900" height="200" rx="10"
              fill="rgba(8, 51, 68, 0.15)" stroke="#22d3ee" stroke-width="1.5"/>
        <text x="120" y="142" fill="#22d3ee" font-size="12" font-weight="700">garden.exe</text>
        <text x="200" y="142" fill="#94a3b8" font-size="10">github.com/dashimaki/garden &middot; 47.2 MB &middot; HTTP :7373</text>

        <!-- 3 endpoint groups -->
        <rect x="140" y="160" width="260" height="130" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1"/>
        <text x="270" y="180" fill="#22d3ee" font-size="11" font-weight="700" text-anchor="middle">CRUD (4 actions)</text>
        <g font-size="10" fill="white" text-anchor="start">
          <text x="156" y="200">POST   /v1/memories</text>
          <text x="156" y="218">GET    /v1/memories/{key}</text>
          <text x="156" y="236">GET    /v1/memories?prefix=</text>
          <text x="156" y="254">DELETE /v1/memories/{key}</text>
        </g>
        <text x="270" y="278" fill="#94a3b8" font-size="9" text-anchor="middle">write &middot; read &middot; list &middot; forget</text>

        <rect x="420" y="160" width="260" height="130" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1"/>
        <text x="550" y="180" fill="#22d3ee" font-size="11" font-weight="700" text-anchor="middle">Agentic RAG</text>
        <g font-size="10" fill="white" text-anchor="start">
          <text x="436" y="200">POST   /v1/context/resolve</text>
          <text x="436" y="218">GET    /v1/pipelines</text>
          <text x="436" y="236">GET    /v1/pipelines/{name}</text>
          <text x="436" y="254">GET    /v1/pipelines/.../runs</text>
        </g>
        <text x="550" y="278" fill="#94a3b8" font-size="9" text-anchor="middle">read-only &middot; cite &middot; dual gate</text>

        <rect x="700" y="160" width="270" height="130" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1"/>
        <text x="835" y="180" fill="#22d3ee" font-size="11" font-weight="700" text-anchor="middle">Ops</text>
        <g font-size="10" fill="white" text-anchor="start">
          <text x="716" y="200">GET    /health</text>
          <text x="716" y="218">5-component status</text>
          <text x="716" y="244" fill="#94a3b8">graceful start/stop</text>
          <text x="716" y="260" fill="#94a3b8">crash restart &times;3 max</text>
        </g>

        <!-- Key prefix router annotation (the dispatch point) -->
        <line x1="550" y1="320" x2="550" y2="360" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>
        <text x="610" y="346" fill="#22d3ee" font-size="11" font-weight="600">router: key prefix</text>

        <!-- ============================================================
             ROW 3: Two backend branches
             ============================================================ -->

        <!-- Left: laputa/governance -->
        <rect x="100" y="370" width="440" height="260" rx="10"
              fill="rgba(6, 78, 59, 0.15)" stroke="#34d399" stroke-width="1.5"/>
        <text x="120" y="382" fill="#34d399" font-size="12" font-weight="700">laputa / governance</text>
        <text x="120" y="396" fill="#94a3b8" font-size="9">github.com/dashimaki/laputa &middot; V1 &middot; pure file</text>

        <rect x="120" y="416" width="180" height="60" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="210" y="438" fill="white" font-size="12" font-weight="600" text-anchor="middle">engine</text>
        <text x="210" y="454" fill="#94a3b8" font-size="9" text-anchor="middle">14 section CRUD</text>
        <text x="210" y="468" fill="#34d399" font-size="9" text-anchor="middle">+ policy source</text>

        <rect x="320" y="416" width="200" height="160" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="420" y="436" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">14 sections</text>
        <text x="420" y="450" fill="#94a3b8" font-size="8" text-anchor="middle">~/.laputa/sections/*.json</text>
        <g font-size="10" fill="#cbd5e1" text-anchor="start">
          <text x="335" y="470">01 identity</text>
          <text x="335" y="486">02 relationship</text>
          <text x="335" y="502">03 commitment</text>
          <text x="335" y="518">04 preferences</text>
          <text x="335" y="534">05 memory_md</text>
          <text x="335" y="550">06 history_md</text>
        </g>
        <g font-size="10" fill="#cbd5e1" text-anchor="start">
          <text x="450" y="470">07 daily</text>
          <text x="450" y="486">08 weekly</text>
          <text x="450" y="502">09 monthly</text>
          <text x="450" y="518" fill="#fb7185">10–14 tbd</text>
        </g>

        <line x1="300" y1="446" x2="318" y2="446" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-green)"/>
        <line x1="210" y1="476" x2="210" y2="595" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-green)"/>
        <text x="218" y="585" fill="#94a3b8" font-size="9">FileStore</text>

        <rect x="120" y="595" width="400" height="20" rx="4" fill="rgba(6, 78, 59, 0.3)" stroke="#34d399" stroke-width="0.5" stroke-dasharray="2,2"/>

        <!-- Right: mentle/facade -->
        <rect x="560" y="370" width="440" height="260" rx="10"
              fill="rgba(76, 29, 149, 0.15)" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="580" y="382" fill="#a78bfa" font-size="12" font-weight="700">mentle / facade</text>
        <text x="580" y="396" fill="#94a3b8" font-size="9">github.com/dashimaki/mentle &middot; V2 &middot; multi-store</text>

        <rect x="580" y="416" width="180" height="60" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="670" y="438" fill="white" font-size="12" font-weight="600" text-anchor="middle">facade.Service</text>
        <text x="670" y="454" fill="#94a3b8" font-size="9" text-anchor="middle">+ 17 internal pkgs</text>
        <text x="670" y="468" fill="#a78bfa" font-size="9" text-anchor="middle">graceful degrade</text>

        <rect x="780" y="416" width="200" height="160" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="880" y="436" fill="#a78bfa" font-size="11" font-weight="700" text-anchor="middle">backends</text>
        <g font-size="10" fill="#cbd5e1" text-anchor="start">
          <text x="795" y="458">&middot; redis</text>
          <text x="795" y="476">&middot; sqlite</text>
          <text x="795" y="494">&middot; sqlite-vec</text>
          <text x="795" y="512">&middot; govector</text>
          <text x="795" y="538" fill="#94a3b8">hybrid (rrf+bm25)</text>
          <text x="795" y="554" fill="#94a3b8">kg &middot; timeline &middot; diary</text>
        </g>
        <g font-size="10" fill="#cbd5e1" text-anchor="start">
          <text x="900" y="458">&middot; hybrid</text>
          <text x="900" y="476">&middot; kg</text>
          <text x="900" y="494">&middot; timeline</text>
          <text x="900" y="512">&middot; diary / journal</text>
          <text x="900" y="538" fill="#a78bfa">Retriever</text>
          <text x="900" y="554" fill="#a78bfa">(for rag)</text>
        </g>

        <line x1="760" y1="446" x2="778" y2="446" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
        <line x1="670" y1="476" x2="670" y2="595" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
        <text x="678" y="585" fill="#94a3b8" font-size="9">Storage</text>
        <rect x="580" y="595" width="400" height="20" rx="4" fill="rgba(76, 29, 149, 0.3)" stroke="#a78bfa" stroke-width="0.5" stroke-dasharray="2,2"/>

        <!-- ============================================================
             Criss-cross from router to two backends
             ============================================================ -->
        <path d="M 540 350 L 540 408 L 320 408 L 320 414" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
        <path d="M 560 350 L 560 408 L 670 408 L 670 414" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>
        <text x="430" y="402" fill="#34d399" font-size="10">section:*</text>
        <text x="615" y="402" fill="#a78bfa" font-size="10">memory:*</text>

        <!-- ============================================================
             ROW 4: Pipeline read-only flows (below CRUD flow)
             ============================================================ -->
        <rect x="100" y="660" width="900" height="50" rx="10"
              fill="rgba(136, 19, 55, 0.10)" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="6,3"/>
        <text x="120" y="682" fill="#fb7185" font-size="12" font-weight="700">read-only path: agentic_recall_v1</text>
        <text x="120" y="700" fill="#94a3b8" font-size="10">9 steps &middot; load_governance &rarr; resolve_policy &rarr; build_plan &rarr; retrieve &rarr; expand_graph &rarr; judge &rarr; dedup &rarr; governance_filter &rarr; assemble_context</text>

        <!-- short stub from RAG group to ROW 4 (no longer crosses mentle box) -->
        <line x1="550" y1="290" x2="550" y2="370" stroke="#fb7185" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-rose)"/>
        <text x="556" y="335" fill="#fb7185" font-size="10">resolve (read-only)</text>

      </svg>
    </div>

    <p class="footer">
      garden/docs/architecture/garden-laputa-architecture.html &middot; 2026-07-15
    </p>
  </div>
</body>
</html>
